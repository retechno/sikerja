# /etc/nginx/sites-available/sikerja — Nginx di host Ubuntu: menghentikan TLS lalu meneruskan ke container web (127.0.0.1:8081).
# Ganti sikerja.perusahaan.id. Sertifikat: sudo certbot --nginx -d sikerja.perusahaan.id (certbot menambahkan blok 443 & redirect).
server {
    listen 80;
    listen [::]:80;
    server_name sikerja.perusahaan.id;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Setelah certbot membuat blok `listen 443 ssl`, tambahkan di blok itu:
    #   add_header Strict-Transport-Security "max-age=31536000" always;
}
