name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test pada MySQL & Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      # test memakai MySQL & Redis sungguhan (skema dari migrasi asli); lihat internal/testutil/db.go
      TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/?charset=utf8mb4&parseTime=true&loc=UTC
      TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
      - name: go test
        # -p 1: paket dijalankan bergantian karena berbagi satu server Redis
        run: go test -p 1 -count=1 ./...

  backend-sqlite:
    name: Backend (test cepat tanpa layanan eksternal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -count=1 ./...

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Image produksi (build saja)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: api
        uses: docker/build-push-action@v6
        with: { context: ./backend, target: api, push: false, cache-from: type=gha,scope=api, cache-to: "type=gha,scope=api,mode=max" }
      - name: worker
        uses: docker/build-push-action@v6
        with: { context: ./backend, target: worker, push: false, cache-from: type=gha,scope=worker, cache-to: "type=gha,scope=worker,mode=max" }
      - name: web
        uses: docker/build-push-action@v6
        with: { context: ./frontend, target: web, push: false, cache-from: type=gha,scope=web, cache-to: "type=gha,scope=web,mode=max" }
      - name: compose produksi valid
        run: |
          cp .env.production.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=0123456789abcdef0123456789abcdef/; s/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=x/; s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=x/; s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=x/; s/^SMTP_HOST=.*/SMTP_HOST=smtp.example.com/' .env
          docker compose -f docker-compose.prod.yml config --quiet
